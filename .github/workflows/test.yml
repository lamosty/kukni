name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Package versions use the commit count; shallow history can make an
          # otherwise newer build sort older than an installed alpha.
          fetch-depth: 0

      # WebKit brings the codecs that make the optional media smoke runnable;
      # GTK's separately packaged media backend must be present too. This does
      # not enable automatic media routing in the application.
      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap \
            gir1.2-adw-1 \
            gir1.2-gst-plugins-base-1.0 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gtk-4.0 \
            gir1.2-webkit-6.0 \
            libgtk-4-media-gstreamer \
            libxtst6 \
            poppler-utils \
            python3-gi \
            webp-pixbuf-loader \
            xvfb \
            xauth

      - name: Run tests
        run: make test

      - name: Verify real GTK previews and navigation
        run: make test-ui

      # Fallback resilience is tested above; it is not proof that an ordinary
      # installation can display PDF or HTML content. These separate gates
      # really render through the fixed installed launcher's sandbox boundary,
      # never by giving arbitrary checkout scripts its AppArmor permission.
      - name: Build and verify the installed Ubuntu package
        run: |
          python3 packaging/build-deb.py
          sudo apt-get install --yes --no-install-recommends ./dist/kukni_*.deb
          /usr/bin/kukni --check
          make test-installed

      # Keep the exact tested package, not a second unverified rebuild. These
      # expiring CI artifacts are alpha test downloads, not a public release
      # channel or an APT repository. Never upload the checkout or private data.
      - name: Checksum the verified package
        working-directory: dist
        run: sha256sum kukni_*.deb > SHA256SUMS

      - name: Keep the verified Ubuntu alpha package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kukni-ubuntu-24.04-${{ github.sha }}
          path: |
            dist/kukni_*.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
