name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            gir1.2-adw-1 \
            gir1.2-gst-plugins-base-1.0 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gtk-4.0 \
            python3-gi \
            webp-pixbuf-loader \
            xvfb \
            xauth

      - name: Run tests
        run: make test

      - name: Verify real GTK previews and navigation
        run: make test-ui

      # Fallback resilience is tested above; it is not proof that an ordinary
      # installation can display PDF pages. This separate gate must really
      # render through the installed launcher's required sandbox boundary.
      - name: Build and verify the installed Ubuntu package
        run: |
          python3 packaging/build-deb.py
          sudo apt-get install --yes --no-install-recommends ./dist/kukni_*.deb
          /usr/bin/kukni --check
