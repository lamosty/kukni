name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install runtime test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gjs gnome-sushi

      - name: Run tests
        run: make test
